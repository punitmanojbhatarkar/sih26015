databases:
  # The PostGIS Database
  - name: jaldrishti-db
    plan: free
    postgresMajorVersion: 15

services:
  # The FastAPI Backend
  - type: web
    name: jaldrishti-backend
    plan: free
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: POSTGRES_USER
        fromDatabase:
          name: jaldrishti-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: jaldrishti-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: jaldrishti-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: jaldrishti-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: jaldrishti-db
          property: database

